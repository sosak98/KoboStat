databases:
  - name: kobostat-db
    plan: free
    databaseName: kobostat
    user: kobostat

services:
  - type: web
    name: kobostat
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /accounts/login/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: kobostat-db
          property: connectionString
      # Plan gratuit Render = 512 Mo de RAM : 1 seul worker Gunicorn (avec
      # plusieurs threads) pour éviter les "Out of memory". À augmenter
      # (ex: 2 ou 3) si vous passez sur un plan payant avec plus de RAM.
      - key: WEB_CONCURRENCY
        value: "1"
      - key: CRON_SYNC_SECRET
        generateValue: true
